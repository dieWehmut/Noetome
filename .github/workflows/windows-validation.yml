name: Windows validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/b15-*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        id: checkout
        env:
          # Historical evidence has paths longer than MAX_PATH. Scope this to
          # the checkout process rather than changing the runner's Git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '26.10.0'
          cache: npm
      - name: Create evidence directory
        id: evidence
        if: always()
        run: New-Item -ItemType Directory -Force .artifacts/windows-validation | Out-Null
      - name: Install locked Rust toolchain
        id: rust
        if: always() && steps.checkout.outcome == 'success' && steps.evidence.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt *>&1 | Tee-Object .artifacts/windows-validation/rust-setup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show *>&1 | Tee-Object .artifacts/windows-validation/rust-identity.log
          exit $LASTEXITCODE
      - name: Prepare locked portable PDF Python
        id: runtime
        if: always() && steps.checkout.outcome == 'success' && steps.evidence.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/prepare_windows_runtime.ps1 *>&1 | Tee-Object .artifacts/windows-validation/python-setup.log
          $taskPython = Join-Path $env:GITHUB_WORKSPACE 'target/windows-runtime/python/python.exe'
          "NOETOME_PDF_PYTHON=$taskPython" >> $env:GITHUB_ENV
          "NOETOME_TEST_PYTHON=$taskPython" >> $env:GITHUB_ENV
          (Split-Path $taskPython -Parent) >> $env:GITHUB_PATH
          Copy-Item target/windows-runtime/runtime-receipt.json .artifacts/windows-validation/
      - name: Install locked frontend dependencies
        id: npm
        if: always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.evidence.outcome == 'success'
        run: |
          npm ci --ignore-scripts *>&1 | Tee-Object .artifacts/windows-validation/npm-setup.log
          exit $LASTEXITCODE
      - name: Rust format
        if: always() && steps.rust.outcome == 'success'
        run: |
          cargo fmt --all --check *>&1 | Tee-Object .artifacts/windows-validation/rust-fmt.log
          exit $LASTEXITCODE
      - name: Rust workspace check
        if: always() && steps.rust.outcome == 'success'
        run: |
          cargo check --workspace --locked *>&1 | Tee-Object .artifacts/windows-validation/rust-check.log
          exit $LASTEXITCODE
      - name: Rust workspace tests
        if: always() && steps.rust.outcome == 'success' && steps.runtime.outcome == 'success'
        run: |
          cargo test --workspace --locked *>&1 | Tee-Object .artifacts/windows-validation/rust-tests.log
          exit $LASTEXITCODE
      - name: Build ordinary debug CLI for independent Python behaviors
        id: cli
        if: always() && steps.rust.outcome == 'success'
        run: |
          cargo build -p noetome-cli --locked *>&1 | Tee-Object .artifacts/windows-validation/cli-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NOETOME_TEST_BINARY=$env:GITHUB_WORKSPACE/target/debug/noetome.exe" >> $env:GITHUB_ENV
      - name: Python full regression
        if: always() && steps.runtime.outcome == 'success' && steps.cli.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v *>&1 | Tee-Object .artifacts/windows-validation/python-tests.log
          exit $LASTEXITCODE
      - name: PDF payload byte binding
        if: always() && steps.runtime.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/build_pdf_sidecar.py --check *>&1 | Tee-Object .artifacts/windows-validation/pdf-payload.log
          exit $LASTEXITCODE
      - name: Frontend typecheck and production build
        if: always() && steps.npm.outcome == 'success'
        run: |
          npm run web:build *>&1 | Tee-Object .artifacts/windows-validation/web-build.log
          exit $LASTEXITCODE
      - name: Desktop release executable
        if: always() && steps.rust.outcome == 'success' && steps.npm.outcome == 'success'
        run: |
          npm run desktop:build -- --no-bundle *>&1 | Tee-Object .artifacts/windows-validation/desktop-build.log
          exit $LASTEXITCODE
      - name: Packaging contract audit
        if: always() && steps.runtime.outcome == 'success' && steps.npm.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_desktop_package.py --json *>&1 | Tee-Object .artifacts/windows-validation/package-audit.json
          exit $LASTEXITCODE
      - name: Development ledger check
        if: always() && steps.runtime.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/devlog.py check *>&1 | Tee-Object .artifacts/windows-validation/devlog-check.log
          exit $LASTEXITCODE
      - name: Record source and environment identity
        if: always() && steps.evidence.outcome == 'success'
        run: |
          $taskFacts = [ordered]@{
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            os = [Environment]::OSVersion.VersionString
            node = (& node --version)
            rust = (& rustc --version)
            python = $env:NOETOME_TEST_PYTHON
          }
          $taskFacts | ConvertTo-Json | Set-Content .artifacts/windows-validation/environment.json -Encoding utf8
          git diff --check *>&1 | Tee-Object .artifacts/windows-validation/git-diff-check.log
          exit $LASTEXITCODE
      - name: Upload raw Windows evidence, including failures
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/windows-validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
