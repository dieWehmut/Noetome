name: Windows validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native checks to run; use one target when unrelated code is unchanged.
        type: choice
        options: [all, rust, python, python-soak, desktop]
        default: all
  push:
    branches:
      - main
      - 'codex/b15-*'
      - 'codex/b16-*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      # Each job publishes its logs independently. One failure must not cancel
      # the other native regression or build evidence.
      fail-fast: false
      matrix:
        # Main pushes and pull requests always run the complete matrix. Only
        # development branch pushes may select a focused check by commit marker;
        # manual dispatch retains its explicit target selection.
        include: ${{ fromJSON((inputs.target == 'rust' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') && contains(github.event.head_commit.message, '[windows:rust]'))) && '[{"target":"rust","profile":"debug"}]' || (inputs.target == 'python-soak' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') && contains(github.event.head_commit.message, '[windows:python-soak]'))) && '[{"target":"python-soak","profile":"debug"}]' || (inputs.target == 'python' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/') && contains(github.event.head_commit.message, '[windows:python]'))) && '[{"target":"python","profile":"debug"}]' || inputs.target == 'desktop' && '[{"target":"desktop","profile":"release"}]' || '[{"target":"rust","profile":"debug"},{"target":"python","profile":"debug"},{"target":"desktop","profile":"release"}]') }}
    defaults:
      run:
        shell: pwsh
    env:
      TASK_EVIDENCE_DIR: .artifacts/windows-validation/${{ matrix.target }}
      # Bound unrelated Python process startups during short protocol deadlines.
      # Workload concurrency is exercised explicitly by the behavior tests.
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
        env:
          # Scope long-path support to checkout; preserve historical evidence.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - name: Create evidence directory
        id: evidence
        if: always()
        run: New-Item -ItemType Directory -Force $env:TASK_EVIDENCE_DIR | Out-Null
      - name: Prepare common locked Windows tools and caches
        id: setup
        if: always() && steps.checkout.outcome == 'success' && steps.evidence.outcome == 'success'
        uses: ./.github/actions/windows-setup
        with:
          evidence-dir: ${{ env.TASK_EVIDENCE_DIR }}
          target-profile: ${{ matrix.profile }}
          cache-task: ${{ matrix.target }}
      - name: Rust format
        if: always() && matrix.target == 'rust' && steps.setup.outcome == 'success'
        run: |
          cargo fmt --all --check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/rust-fmt.log"
          exit $LASTEXITCODE
      - name: Rust workspace check
        id: rust_check
        if: always() && matrix.target == 'rust' && steps.setup.outcome == 'success'
        run: |
          cargo check --workspace --locked *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/rust-check.log"
          exit $LASTEXITCODE
      - name: Rust workspace tests, all targets even on failure
        if: always() && matrix.target == 'rust' && steps.setup.outcome == 'success'
        run: |
          cargo test --workspace --locked --no-fail-fast *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/rust-tests.log"
          exit $LASTEXITCODE
      - name: Build ordinary debug CLI for independent Python behaviors
        id: cli
        if: always() && (matrix.target == 'python' || matrix.target == 'python-soak') && steps.setup.outcome == 'success'
        run: |
          cargo build -p noetome-cli --locked *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/cli-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NOETOME_TEST_BINARY=$env:GITHUB_WORKSPACE/target/debug/noetome.exe" >> $env:GITHUB_ENV
          "NOETOME_CORPUS_CLI=$env:GITHUB_WORKSPACE/target/debug/noetome.exe" >> $env:GITHUB_ENV
      - name: Build actual frontend assets required by packaging regression
        id: python_web
        if: always() && matrix.target == 'python' && steps.setup.outcome == 'success'
        run: |
          npm run web:build *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/python-web-build.log"
          exit $LASTEXITCODE
      - name: Python full regression
        if: always() && matrix.target == 'python' && steps.setup.outcome == 'success' && steps.cli.outcome == 'success' && steps.python_web.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/python-tests.log"
          exit $LASTEXITCODE
      - name: Focused Python soak auditor regression
        if: always() && matrix.target == 'python-soak' && steps.setup.outcome == 'success' && steps.cli.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 -m unittest discover -s tests -p 'test_verify_soak_harness.py' -v *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/python-soak-tests.log"
          exit $LASTEXITCODE
      - name: Actual CLI soak runs with independent zero-failure audits
        if: always() && matrix.target == 'python-soak' && steps.setup.outcome == 'success' && steps.cli.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_soak_runtime.py "$env:TASK_EVIDENCE_DIR/soak-behaviors" --binary $env:NOETOME_TEST_BINARY *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/soak-behaviors.log"
          exit $LASTEXITCODE
      - name: Independent real PDF parse and read-only inspection
        if: always() && matrix.target == 'python' && steps.setup.outcome == 'success' && steps.cli.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_pdf_parse.py "$env:TASK_EVIDENCE_DIR/pdf-behaviors" --binary $env:NOETOME_TEST_BINARY *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/pdf-behaviors.log"
          exit $LASTEXITCODE
      - name: PDF payload byte binding
        if: always() && matrix.target == 'python' && steps.setup.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/build_pdf_sidecar.py --check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/pdf-payload.log"
          exit $LASTEXITCODE
      - name: Development ledger check
        if: always() && matrix.target == 'python' && steps.setup.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/devlog.py check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/devlog-check.log"
          exit $LASTEXITCODE
      - name: Frontend typecheck and production build
        id: web
        if: always() && matrix.target == 'desktop' && steps.setup.outcome == 'success'
        run: |
          npm run web:build *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/web-build.log"
          exit $LASTEXITCODE
      - name: Desktop release executable
        id: desktop
        if: always() && matrix.target == 'desktop' && steps.setup.outcome == 'success'
        run: |
          npm run desktop:build -- --no-bundle *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/desktop-build.log"
          exit $LASTEXITCODE
      - name: Packaging contract audit
        if: always() && matrix.target == 'desktop' && steps.setup.outcome == 'success' && steps.web.outcome == 'success'
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_desktop_package.py --json *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/package-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskAudit = Get-Content -Raw -LiteralPath "$env:TASK_EVIDENCE_DIR/package-audit.json" | ConvertFrom-Json
          if ($taskAudit.failures -ne 0 -or $taskAudit.warnings -ne 0) {
            throw 'Desktop packaging audit requires zero failures and zero warnings. See package-audit.json.'
          }
      - name: Record source and environment identity
        if: always() && steps.evidence.outcome == 'success'
        run: |
          $taskFacts = [ordered]@{
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            job = '${{ matrix.target }}'
            scope = '${{ matrix.target == 'python-soak' && 'targeted_soak' || matrix.target }}'
            os = [Environment]::OSVersion.VersionString
            node = (& node --version)
            rust = (& rustc --version)
            python = $env:NOETOME_TEST_PYTHON
          }
          $taskFacts | ConvertTo-Json | Set-Content "$env:TASK_EVIDENCE_DIR/environment.json" -Encoding utf8
          git diff --check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/git-diff-check.log"
          exit $LASTEXITCODE
      - name: Save immutable Cargo dependency cache, even after test failure
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.registry-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.setup.outputs.registry-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Save compiled artifacts after an actual successful check or build
        # Auditor-only soak runs reuse the full debug cache without uploading a
        # duplicate cache for unchanged Rust source and dependencies.
        if: always() && matrix.target != 'python-soak' && steps.setup.outcome == 'success' && steps.setup.outputs.target-hit != 'true' && (steps.rust_check.outcome == 'success' || steps.cli.outcome == 'success' || steps.desktop.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.setup.outputs.target-key }}
          path: ${{ steps.setup.outputs.target-path }}
      - name: Upload raw Windows evidence, including failures
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_EVIDENCE_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
