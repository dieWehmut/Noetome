name: Windows 11 x64 installer

on:
  push:
    branches: [main, 'codex/b15-t03-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      TASK_EVIDENCE_DIR: .artifacts/B15-T03/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - name: Prepare evidence directory
        run: New-Item -ItemType Directory -Force $env:TASK_EVIDENCE_DIR | Out-Null
      - name: Prepare locked tools
        id: setup
        uses: ./.github/actions/windows-setup
        with:
          evidence-dir: ${{ env.TASK_EVIDENCE_DIR }}
          target-profile: release
          cache-task: installer
      - name: Build release CLI
        id: cli
        run: |
          cargo build -p noetome-cli --release --locked *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/cli-release.log"
          exit $LASTEXITCODE
      - name: Stage complete installer resources
        id: payload
        run: |
          $taskPayloadReceipt = & ./scripts/prepare_windows_installer_payload.ps1 -CliBinary "$env:GITHUB_WORKSPACE/target/release/noetome.exe" -RuntimeDir "$env:GITHUB_WORKSPACE/target/windows-runtime" -SourceCommit $env:GITHUB_SHA -PassThru
          $taskPayloadReceipt | ConvertTo-Json -Depth 8 | Set-Content "$env:TASK_EVIDENCE_DIR/payload-stage-receipt.json" -Encoding utf8
          if ($taskPayloadReceipt.manifest_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Structured preparation receipt SHA is missing.' }
          "NOETOME_INSTALLER_MANIFEST_SHA256=$($taskPayloadReceipt.manifest_sha256)" >> $env:GITHUB_ENV
          & $env:NOETOME_TEST_PYTHON -I -B -X utf8 scripts/verify_windows_installer_payload.py target/windows-installer-payload --json --probe-runtime --manifest-sha256 $taskPayloadReceipt.manifest_sha256 *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/payload-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/windows-installer-payload/payload-manifest.json "$env:TASK_EVIDENCE_DIR/"
      - name: Build native NSIS with offline WebView2 installer
        id: nsis
        run: |
          npm run desktop:build -- --config crates/noetome-desktop/tauri.install.conf.json *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/nsis-build.log"
          exit $LASTEXITCODE
      - name: Record the actual embedded Microsoft WebView2 installer
        run: |
          & ./scripts/record_windows_webview_installer.ps1 -NsisScript target/release/nsis/x64/installer.nsi -OutputPath "$env:TASK_EVIDENCE_DIR/webview2-installer.json" *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/webview2-installer.log"
          Copy-Item target/release/nsis/x64/installer.nsi "$env:TASK_EVIDENCE_DIR/installer.nsi"
      - name: Validate source and packaging contracts
        run: |
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_desktop_package.py --json *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/package-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskAudit = Get-Content -LiteralPath "$env:TASK_EVIDENCE_DIR/package-audit.json" -Raw | ConvertFrom-Json
          if ($taskAudit.failures -ne 0 -or $taskAudit.warnings -ne 0) { throw 'Packaging audit requires zero failures and warnings.' }
          & $env:NOETOME_TEST_PYTHON -B -X utf8 -m unittest discover -s tests -p 'test_verify_windows_installer_payload.py' -v *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/payload-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NOETOME_TEST_PYTHON -B -X utf8 -m unittest discover -s tests -p 'test_verify_windows_installation.py' -v *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/installation-verifier-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/devlog.py check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/devlog-check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/git-diff-check.log"
          exit $LASTEXITCODE
      - name: Clean native installation and protected uninstall
        id: installed
        run: |
          $taskInstallers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($taskInstallers.Count -ne 1) { throw 'Exactly one NSIS installer required.' }
          & $env:NOETOME_TEST_PYTHON -B -X utf8 scripts/verify_windows_installation.py --installer $taskInstallers[0].FullName --evidence-dir "$env:GITHUB_WORKSPACE/$env:TASK_EVIDENCE_DIR/installed" --install-dir "$env:LOCALAPPDATA/Programs/Noetome-CI-$env:GITHUB_RUN_ID" --stage-manifest "$env:GITHUB_WORKSPACE/target/windows-installer-payload/payload-manifest.json" --manifest-sha256 $env:NOETOME_INSTALLER_MANIFEST_SHA256 *>&1 | Tee-Object "$env:TASK_EVIDENCE_DIR/installed-smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare downloadable delivery with exact hashes
        id: delivery
        if: steps.installed.outcome == 'success'
        run: |
          $taskDelivery = Join-Path $env:GITHUB_WORKSPACE '.artifacts/B15-T03/delivery'
          New-Item -ItemType Directory -Path $taskDelivery | Out-Null
          $taskInstaller = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($taskInstaller.Count -ne 1) { throw 'Exactly one installer required.' }
          $taskVersion = (Get-Content -LiteralPath crates/noetome-desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $taskName = "Noetome-$taskVersion-$($env:GITHUB_SHA.Substring(0,12))-windows11-x64-setup.exe"
          $taskOutput = Join-Path $taskDelivery $taskName
          Copy-Item -LiteralPath $taskInstaller[0].FullName -Destination $taskOutput
          Copy-Item doc/windows/QUICKSTART.zh-CN.md "$taskDelivery/QUICKSTART.zh-CN.md"
          Copy-Item fixtures/pdf-text-v1/single-page.pdf "$taskDelivery/single-page.pdf"
          Copy-Item fixtures/pdf-text-v1/scanned-page.pdf "$taskDelivery/scanned-page.pdf"
          Copy-Item target/windows-installer-payload/payload-manifest.json "$taskDelivery/payload-manifest.json"
          Copy-Item target/windows-runtime/runtime-receipt.json "$taskDelivery/runtime-receipt.json"
          Copy-Item "$env:TASK_EVIDENCE_DIR/payload-stage-receipt.json" "$taskDelivery/payload-stage-receipt.json"
          Copy-Item "$env:TASK_EVIDENCE_DIR/webview2-installer.json" "$taskDelivery/webview2-installer.json"
          $taskInstalled = Get-Content -LiteralPath "$env:TASK_EVIDENCE_DIR/installed/summary.json" -Raw | ConvertFrom-Json
          $taskHash = (Get-FileHash -LiteralPath $taskOutput -Algorithm SHA256).Hash.ToLowerInvariant()
          $taskFacts = [ordered]@{
            schema_version = 1
            producer = 'noetome-windows-installer-delivery'
            product_version = $taskVersion
            target = 'Windows 11 x64'
            source_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            installer = $taskName
            installer_bytes = (Get-Item -LiteralPath $taskOutput).Length
            installer_sha256 = $taskHash
            runtime_policy = 'Full locked CPython and PDF dependencies; adjacent VC runtime; offline WebView2 installer.'
            noetome_signature = (Get-AuthenticodeSignature -LiteralPath $taskOutput).Status.ToString()
            native_installation_evidence = 'installed-smoke.log and installed/ in raw evidence artifact'
            installed_payload_snapshot = $taskInstalled.installed_payload_archive
            native_ui = 'Separate Windows 11 staged payload verification; CLI smoke does not prove UI.'
            real_external_model = 'not_run'
            scientific_quality = 'not_run'
          }
          $taskFacts | ConvertTo-Json -Depth 8 | Set-Content "$taskDelivery/delivery.json" -Encoding utf8
          $taskSums = @(Get-ChildItem -LiteralPath $taskDelivery -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          })
          $taskSums | Set-Content "$taskDelivery/SHA256SUMS.txt" -Encoding utf8
          Get-Content "$taskDelivery/delivery.json"
      - name: Save dependency cache
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.registry-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.setup.outputs.registry-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Save compiled release after actual successful build
        if: always() && steps.nsis.outcome == 'success' && steps.setup.outputs.target-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.setup.outputs.target-key }}
          path: ${{ steps.setup.outputs.target-path }}
      - name: Upload downloadable installation materials
        if: steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Noetome-windows11-x64-${{ github.sha }}
          path: .artifacts/B15-T03/delivery/
          if-no-files-found: error
          retention-days: 90
      - name: Record exact environment
        if: always()
        run: |
          @{ source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; os=[Environment]::OSVersion.VersionString; rust=(& rustc --version); node=(& node --version); python=$env:NOETOME_TEST_PYTHON; scope='Windows 2025 native build and clean install; Windows 11 UI separate' } | ConvertTo-Json | Set-Content "$env:TASK_EVIDENCE_DIR/environment.json" -Encoding utf8
      - name: Upload raw evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_EVIDENCE_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
