[package]
name = "noetome-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Noetome 命令行入口"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }
same-file = "=1.0.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"
winapi-util = "=0.1.11"

[[bin]]
name = "noetome"
path = "src/main.rs"

[lints]
workspace = true
