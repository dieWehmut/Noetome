<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<rect id="image-canvas" x="0" y="0" width="960" height="520" fill="#ffffff"/>
<circle id="element-response" cx="480.000" cy="210.000" r="90.000" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<rect id="element-feed" x="40" y="150" width="220" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<rect id="element-output" x="700" y="150" width="220" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text id="element-feed-label" x="150.000" y="202.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">Feed</text>
<text id="element-feed-unit" x="150.000" y="220.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">mmol/L</text>
<text id="element-response-label" x="480.000" y="202.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">Response</text>
<text id="element-response-unit" x="480.000" y="220.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">a.u.</text>
<text id="element-output-label" x="810.000" y="202.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">Outlet</text>
<text id="element-output-unit" x="810.000" y="220.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">mmol/L</text>
<rect id="legend-positive" x="40" y="360" width="360" height="45" fill="#c5efcb" stroke="#000000" stroke-width="2"/>
<text id="legend-positive-label" x="220.000" y="374.500" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">+</text>
<text id="legend-positive-meaning" x="220.000" y="392.500" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">positive activation</text>
<rect id="legend-negative" x="500" y="360" width="400" height="45" fill="#f5c1c1" stroke="#000000" stroke-width="2"/>
<text id="legend-negative-label" x="700.000" y="374.500" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">-</text>
<text id="legend-negative-meaning" x="700.000" y="392.500" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">negative inhibition</text>
<line id="relation-gain" x1="260" y1="210" x2="390" y2="210" stroke="#000000" stroke-width="2"/>

<text id="relation-gain-effect" x="325.000" y="182.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">+</text>
<text id="relation-gain-label" x="325.000" y="200.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">activates</text>
<text id="relation-gain-unit" x="325.000" y="228.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">s^-1</text>
<line id="relation-loss" x1="570" y1="210" x2="700" y2="210" stroke="#000000" stroke-width="2"/>
<polygon id="relation-loss-head" points="700.000,210.000 690.000,215.000 690.000,205.000" fill="#000000" stroke="#000000" stroke-width="2"/>
<text id="relation-loss-effect" x="635.000" y="182.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">−</text>
<text id="relation-loss-label" x="635.000" y="200.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">inhibits</text>
<text id="relation-loss-unit" x="635.000" y="228.000" fill="#000000" font-size="14" font-family="sans-serif" text-anchor="middle">s^-1</text>
</svg>
