<!doctype html>
<html lang="zh-CN">
  <head>
    <script type="module">import { injectIntoGlobalHook } from "/@react-refresh";
injectIntoGlobalHook(window);
window.$RefreshReg$ = () => {};
window.$RefreshSig$ = () => (type) => type;</script>

    <script type="module" src="/@vite/client"></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f3" />
    <title>Noetome / controlled theme-read</title>
  </head>
  <body>
    <script>const original=Storage.prototype.getItem; Storage.prototype.getItem=function(key){if(key==='noetome.appearance.theme')throw new DOMException('Controlled read failure','SecurityError');return original.call(this,key)};</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
